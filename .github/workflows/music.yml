name: Sync music playlist

on:
  schedule:
    # Every six hours; NetEase playlists change far less often than that.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # The snapshot lives on its own branch so updating it never triggers a
      # site rebuild; the page fetches it from raw.githubusercontent.com.
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch official playlist
        run: node scripts/sync-playlist.mjs data/music/playlist.json

      - name: Commit snapshot
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- music/playlist.json; then
            echo "playlist unchanged"
            exit 0
          fi
          git add music/playlist.json
          git commit -m "chore: sync netease playlist"
          git push
