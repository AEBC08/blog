name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # The browser cannot call NetEase directly (no CORS, no JSONP), so the only
    # way to refresh the playlist is to rebuild with a fresh same-origin
    # snapshot. Half-hourly keeps it close to live; scheduled runs skip the
    # lint/typecheck gates because the code itself did not change.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser only ever reads a same-origin snapshot: fetching NetEase (or
      # a JSON host) cross-origin fails behind CORS, tracking prevention or a
      # flaky CDN. Refreshing it here keeps the client simple; a failure falls
      # back to the committed copy.
      - name: Refresh playlist snapshot
        run: node scripts/sync-playlist.mjs
        continue-on-error: true

      - name: Lint
        if: github.event_name != 'schedule'
        run: pnpm lint

      - name: Typecheck
        if: github.event_name != 'schedule'
        run: pnpm typecheck

      - name: Build
        run: npx nuxt build --preset github_pages
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          # Prerendering reads repo metadata from the GitHub API; the default
          # token lifts the anonymous 60/h limit to 5000/h.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
