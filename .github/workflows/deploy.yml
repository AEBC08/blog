name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Every half hour, but the build only runs when the playlist actually
    # changed; an idle playlist costs a few seconds instead of a full build.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Cheap job: refresh the snapshot, commit it when it moved, and tell the build
  # job whether a rebuild is worth it.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh playlist snapshot
        run: node scripts/sync-playlist.mjs
        continue-on-error: true

      - name: Detect playlist changes
        id: diff
        run: |
          if git diff --quiet -- data/playlist.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Persist the fresh snapshot so the committed copy never goes stale; the
      # build re-reads it, and [skip ci] keeps this push from looping.
      - name: Commit snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playlist.json
          git commit -m "chore: sync netease playlist [skip ci]"
          git push

  build:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The playlist is baked into the build, so read the freshest snapshot
      # here too; a failure just falls back to the committed copy.
      - name: Refresh playlist snapshot
        run: node scripts/sync-playlist.mjs
        continue-on-error: true

      - name: Lint
        if: github.event_name != 'schedule'
        run: pnpm lint

      - name: Typecheck
        if: github.event_name != 'schedule'
        run: pnpm typecheck

      - name: Build
        run: npx nuxt build --preset github_pages
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          # Prerendering reads repo metadata from the GitHub API; the default
          # token lifts the anonymous 60/h limit to 5000/h.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
